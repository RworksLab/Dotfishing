function settings(){modal(`<h2>${ico('gear',1)}設定</h2><label>BGM音量<input type="range" id="sBgm" min="0" max="1" step="0.1" value="${S.set.bgm}"></label><label>効果音音量<input type="range" id="sSe" min="0" max="1" step="0.1" value="${S.set.se}"></label><label>環境音（釣り場）<input type="range" id="sAmb" min="0" max="1" step="0.1" value="${S.set.amb??.7}"></label>
<div class="btns" style="margin:10px 0"><button class="wb" data-act="save">データ保存</button><button class="wb" data-act="load">データ読み込み</button><button class="wb" data-act="copycode">セーブコードをコピー</button><button class="wb" data-act="reset">最初からやり直す</button></div>
<p class="muted">別の端末に移すときは、セーブコードを貼り付けて読み込みます。</p><textarea id="code" placeholder="セーブコードを貼り付け"></textarea><button class="wb big" data-act="loadcode" style="margin:8px 0">コードから読み込む</button><button class="wb big" data-act="close">閉じる</button><p class="muted" style="text-align:center;margin:8px 0 0">ドット釣り日和 ver ${VER}</p>`);
$('#sBgm').oninput=e=>{S.set.bgm=+e.target.value;save()};$('#sSe').oninput=e=>{S.set.se=+e.target.value;se('tap');save()};$('#sAmb').oninput=e=>{S.set.amb=+e.target.value;save()}}
function useData(d,msg){if(!d||!d.v||!d.day){toast('データを読み込めませんでした');return}S=Object.assign(fresh(),d);cleanDev();closeModal();$('#title').style.display='none';scr='home';F=null;render();toast(msg)}
const A={
go:v=>go(v),settings,close:closeModal,
update:()=>{try{save()}catch(e){}location.replace(location.pathname+'?v='+(updVer||Date.now()))},
claim:i=>{const q=S.quests[i];if(q.got||!qInfo(q).ok)return;q.got=1;S.coins+=q.rw;se('coin');toast(`${q.rw}コインを受け取った`);save();render()},
sleep:()=>modal(`<h2>${ico('moon',1)}いつまで寝る？</h2><p class="muted">今は ${fmt(S.min)}。翌日まで寝ると日付が進み、依頼が新しくなります。</p>${WAKE.map((w,i)=>`<button class="wb big" style="margin-bottom:8px" data-act="sleepto" data-v="${i}">${w[0]}（${wakeToday(w[1])?'今日':'明日'} ${fmt(w[1])}）</button>`).join('')}<button class="wb big" data-act="close">やめる</button>`),
sleepto:i=>sleepTo(+i),sellall:sellAll,
unlock:i=>{const s=SPOTS[i];if(S.coins<s.cost){toast(`コインが足りません（あと${(s.cost-S.coins).toLocaleString()}）`);se('bad');return}S.coins-=s.cost;S.unl[s.id]=1;se('coin');toast(`${s.name}を解放した`);save();render()},
fish:i=>{S.lastSpot=+i;save();F={spot:+i,phase:'idle',g:50};go('fishing')},
cast:()=>cast(),
sellnow:()=>{const c=F.last,v=priceOf(FISH[c.id],c.size);S.coins+=v;se('coin');toast(`${v}コインになった`);closeModal();save();updTop()},
keep:()=>{S.inv.push(F.last);toast('クーラーボックスに入れた');closeModal();save()},
aq:i=>{aqSpot=+i;render()},info:i=>info(+i),
dxs:v=>{dexF.spot=+v;render()},dxr:v=>{dexF.r=+v;render()},tab:v=>{shopTab=v;render()},
buy:i=>{const it=GEAR[shopTab].items[i];if(S.coins<it[2]){toast(`コインが足りません（あと${(it[2]-S.coins).toLocaleString()}）`);se('bad');return}S.coins-=it[2];S.own[shopTab].push(+i);S.eq[shopTab]=+i;se('coin');toast(`${it[0]}を買って装備した`);save();render()},
equip:i=>{S.eq[shopTab]=+i;toast('装備を変更した');save();render()},
save:()=>toast(save()?'保存しました':'この環境では保存できません。セーブコードを使ってください'),
load:()=>{const d=loadLocal();d?useData(d,'読み込みました'):toast('保存データがありません')},
copycode:()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ta=$('#code');ta.value=code;try{navigator.clipboard.writeText(code).then(()=>toast('コピーしました'),()=>toast('下の欄のコードを長押しでコピーしてね'))}catch(e){toast('下の欄のコードをコピーしてね')}},
loadcode:()=>{try{useData(JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim())))),'コードから読み込みました')}catch(e){toast('コードが正しくありません')}},
reset:()=>modal(`<h2>最初からやり直す？</h2><p>今のデータは消えて、1日目からはじまります。元には戻せません。</p><div class="btns" style="margin:10px 0 0"><button class="wb" data-act="close">やめる</button><button class="wb gold" data-act="newgame">やり直す</button></div>`),
fishgo:()=>{if(scr==='fishing'&&F)return;const i=(S.unl[SPOTS[S.lastSpot||0].id]||DEV())?(S.lastSpot||0):0;F={spot:i,phase:'idle',g:50};go('fishing')},
cont:()=>{ac();const d=loadLocal();if(d)useData(d,'おかえりなさい');else toast('保存データがありません')},
newgame:()=>{ac();closeModal();S=fresh();S.firstLook=1;F=null;save();$('#title').style.display='none';scr='closet';render();toast('まずは自分の姿を決めよう')},
closet:()=>go('closet'),

sellone:i=>{const c=S.inv[+i];if(!c)return;const v=priceOf(FISH[c.id],c.size);S.coins+=v;S.inv.splice(+i,1);se('coin');toast(`${FISH[c.id].name}を${v}コインで売った`);save();render()},
aqmap:()=>aqMapOpen(),aqmapclose:()=>{mapOpen=false;const m=$('#aqMap');if(m)m.style.display='none'},aqgo:v=>{mapOpen=false;$('#aqMap').style.display='none';aqEnter(+v)},
pq:v=>{if(!aqPQ)return;const n=aqPQ.ids.length;plaque(aqPQ.ids,(aqPQ.i+ +v+n)%n)},aqside:v=>{aqChar.tx=+v<0?4:AW-4;aqChar.ty=clamp(aqChar.y,AWY+14,AH-4)},
aqall:()=>{aqAll=!aqAll;aqEnter(aqRoom);aqMapOpen()},
lks:v=>{const[k,i]=v.split(':');S.look2[k]=+i;save();render()},
lkr:()=>{for(const k in LOOKS)S.look2[k]=rnd(LOOKS[k]);S.look2.hs=rnd(HAIRSTY);save();render()},
hs:d=>{const n=HAIRSTY.length;S.look2.hs=(((S.look2.hs||0)+ +d)%n+n)%n;save();render()},
lkreset:()=>{S.look2={...LOOKDEF};save();render()},
lkdone:()=>{const f=S.firstLook;delete S.firstLook;save();go('home');if(f)toast('1日目の朝。釣りに出かけよう！')}};
const rnd=a=>Math.floor(Math.random()*a.length);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(S&&b.dataset.act!=='cast')se('tap');A[b.dataset.act]?.(b.dataset.v)});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
document.addEventListener('pointerdown',e=>{if(cvMode==='fish'&&e.target.closest&&e.target.closest('#fsBox')&&!e.target.closest('button')){hookTap();return}
if(cvMode==='mini'&&e.target.closest&&e.target.closest('#mWrap')){e.preventDefault();tapFish();return}
if(e.target.id==='cv'){if(cvMode==='mini'){e.preventDefault();tapFish()}else if(cvMode==='aq')aqTap(e);else if(cvMode==='island')islTap(e)}});

$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!$('#mbox').querySelector('[data-act=sellnow]'))closeModal()});

/* ---------- 更新チェック ---------- */
const verNum=v=>String(v).split('.').map(n=>+n||0);
const newer=(a,b)=>{const A=verNum(a),B=verNum(b);for(let i=0;i<3;i++){if((A[i]||0)!==(B[i]||0))return(A[i]||0)>(B[i]||0)}return false};
let updVer=null;
async function checkUpdate(){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(j&&j.version&&newer(j.version,VER)){updVer=j.version;$('#upd span').textContent=`更新があります。（ver ${j.version}）`;$('#upd').classList.add('show')}}catch(e){}}
checkUpdate();setInterval(checkUpdate,30*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
function cleanDev(){if(S.dev){delete S.dev;for(const k in S.eq)if(!S.own[k].includes(S.eq[k]))S.eq[k]=Math.max(...S.own[k])}}
{const d=loadLocal();$('#title').style.display='none';if(d){S=Object.assign(fresh(),d);cleanDev();scr='home';render()}else{S=fresh();S.firstLook=1;save();scr='closet';render();toast('まずは自分の姿を決めよう')}}
document.addEventListener('pointerdown',()=>ac(),{once:true});
}
</script>
</body>
</html>
